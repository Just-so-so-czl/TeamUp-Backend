spring:
  application:
    name: TeamUp-backEnd
  main:
    banner-mode: "console"
  datasource:
    url: jdbc:mysql://localhost:3307/TeamUp?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=60000&autoReconnect=true
    username: root
    password: 103119
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      validation-timeout: 3000
      initialization-fail-timeout: 0
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      connection-test-query: SELECT 1
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      username:
      password: 103119
      timeout: 5s
      connect-timeout: 5s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 1
          max-wait: 2s
    mongodb:
      uri: mongodb://admin:103119@localhost:27017/teamup?authSource=admin
      auto-index-creation: true


  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /
    connection-timeout: 60000

    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 1
        max-concurrency: 10
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: ${MAIL_PROTOCOL:smtps}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          connectiontimeout: 5000
          writetimeout: 5000
  ai:
    openai:
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      summary:
        model: ${SPRING_AI_OPENAI_SUMMARY_MODEL:Qwen3-32B}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_MODEL:gpt-4o-mini}

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.czl.teamupbackend.model.entity

jwt:
  secret: TeamUpJwtSecretKeyAtLeast32Chars!
  expire-ms: 86400000
  issuer: teamup-backend

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:team-up-bucket}

task-reminder:
  scan-on-startup: ${TASK_REMINDER_SCAN_ON_STARTUP:false}

collaboration-summary:
  # 生产环境请通过 COLLABORATION_SUMMARY_INTERNAL_TOKEN 覆盖，且仅允许协同服务访问内部接口。
  internal-token: ${COLLABORATION_SUMMARY_INTERNAL_TOKEN:teamup-local-collaboration-summary-token}
  delay-queue:
    scan-interval-ms: ${COLLABORATION_SUMMARY_SCAN_INTERVAL_MS:10000}

collaboration-agent:
  # 仅 TeamUp 后端可调用协同服务的草案快照与受控写入接口。
  internal-url: ${COLLABORATION_AGENT_INTERNAL_URL:http://127.0.0.1:1235}
  internal-token: ${COLLABORATION_AGENT_INTERNAL_TOKEN:teamup-local-collaboration-agent-token}
